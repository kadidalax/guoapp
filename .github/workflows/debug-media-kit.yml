name: Debug media kit archives

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Compare extractors
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mk'
          New-Item -ItemType Directory -Force $work | Out-Null
          $archives = @(
            @{ Name = 'ANGLE.7z'; Url = 'https://github.com/alexmercerind/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE.7z' },
            @{ Name = 'mpv-dev-x86_64-20230924-git-652a1dd.7z'; Url = 'https://github.com/media-kit/libmpv-win32-video-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z' }
          )
          foreach ($archive in $archives) {
            $file = Join-Path $work $archive.Name
            curl.exe -sL -o $file $archive.Url
            Write-Host "=== $($archive.Name) 大小 $((Get-Item $file).Length) ==="
            Write-Host '--- cmake -E tar tf 列表 ---'
            & cmake -E tar tf $file
            $tarDir = Join-Path $work ('tar-' + $archive.Name)
            New-Item -ItemType Directory -Force $tarDir | Out-Null
            Push-Location $tarDir
            & cmake -E tar xzf $file 2>&1 | Out-Null
            Pop-Location
            $tarFiles = Get-ChildItem -Recurse -File $tarDir
            Write-Host "--- cmake 解压出 $($tarFiles.Count) 个文件 ---"
            $tarFiles | ForEach-Object { Write-Host ('  ' + $_.FullName.Substring($tarDir.Length + 1)) }
            $zipDir = Join-Path $work ('7z-' + $archive.Name)
            New-Item -ItemType Directory -Force $zipDir | Out-Null
            Push-Location $zipDir
            7z x -y $file | Out-Null
            Pop-Location
            $zipFiles = Get-ChildItem -Recurse -File $zipDir
            Write-Host "--- 7z 解压出 $($zipFiles.Count) 个文件 ---"
            $zipFiles | ForEach-Object { Write-Host ('  ' + $_.FullName.Substring($zipDir.Length + 1)) }
          }
