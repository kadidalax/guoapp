name: Debug media kit archives

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Report tools
        shell: pwsh
        run: |
          Get-Command cmake -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          cmake --version
          $sevenZip = Get-Command 7z, 7za, 7zr -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
          Write-Host "7zip=$sevenZip"
          Test-Path 'C:\Program Files\7-Zip\7z.exe'
      - name: Extract with cmake
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mk'
          New-Item -ItemType Directory -Force $work | Out-Null
          $archives = @(
            @{ Name = 'ANGLE.7z'; Url = 'https://github.com/alexmercerind/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE.7z' },
            @{ Name = 'mpv-dev-x86_64-20230924-git-652a1dd.7z'; Url = 'https://github.com/media-kit/libmpv-win32-video-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z' }
          )
          foreach ($archive in $archives) {
            $file = Join-Path $work $archive.Name
            curl.exe -sL -o $file $archive.Url
            $out = Join-Path $work ('out-' + $archive.Name)
            New-Item -ItemType Directory -Force $out | Out-Null
            Write-Host "=== $($archive.Name) 大小 $((Get-Item $file).Length) ==="
            Push-Location $out
            & cmake -E tar xzf $file
            Write-Host "cmake -E tar xzf 退出码=$LASTEXITCODE"
            Pop-Location
            $items = Get-ChildItem -Recurse $out | Select-Object -First 15 -ExpandProperty FullName
            if (-not $items) { Write-Host '解压结果：空' } else { $items | ForEach-Object { Write-Host $_ } }
          }
